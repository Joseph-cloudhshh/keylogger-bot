<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keylogger Bot</title>
</head>
<body>
    <h1>Keylogger Bot</h1>
    <button onclick="startKeylogger()">Start Keylogger</button>
    <button onclick="stopKeylogger()">Stop Keylogger</button>

    <script>
        async function startKeylogger() {
            const response = await fetch('/start_keylogger', {
                method: 'POST'
            });
            const result = await response.text();
            alert(result);
        }

        async function stopKeylogger() {
            const response = await fetch('/stop_keylogger', {
                method: 'POST'
            });
            const result = await response.text();
            alert(result);
        }
    </script>
</body>
</html>
